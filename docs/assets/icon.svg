<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#1c6b4a"/>
      <stop offset="1" stop-color="#06271d"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9ff7a"/>
      <stop offset="1" stop-color="#7fe08a"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="sq"><rect x="64" y="64" width="896" height="896" rx="204"/></clipPath>
  </defs>
  <rect x="64" y="64" width="896" height="896" rx="204" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="64" y="64" width="896" height="440" fill="url(#gloss)"/>
    <!-- stacked menu rows, the signature of the app -->
    <g fill="#fff" opacity=".07">
      <rect x="64" y="760" width="896" height="44"/>
      <rect x="64" y="836" width="896" height="44"/>
      <rect x="64" y="912" width="896" height="44"/>
    </g>
  </g>
  <!-- dorsal crest: stacked spikes, shrinking toward the tail -->
  <g fill="#3fbf7a">
    <path d="M300 468 L262 338 L372 424 Z"/>
    <path d="M388 420 L368 280 L470 392 Z"/>
    <path d="M480 392 L478 256 L568 380 Z"/>
    <path d="M572 382 L596 262 L660 394 Z"/>
  </g>
  <!-- head -->
  <path d="M236 716 C150 580 296 430 456 410 C590 394 706 410 790 462 C856 502 864 580 794 616 C724 652 650 668 574 710 C470 768 330 810 236 716 Z" fill="url(#skin)"/>
  <!-- dewlap -->
  <path d="M446 742 C470 840 560 872 590 800 C610 756 560 716 510 720 Z" fill="#ff9f43"/>
  <path d="M446 742 C470 840 560 872 590 800" fill="none" stroke="#e8761a" stroke-width="10" stroke-linecap="round" opacity=".5"/>
  <!-- scale line -->
  <path d="M300 640 C420 650 520 620 640 572" fill="none" stroke="#2a8f5a" stroke-width="14" stroke-linecap="round" opacity=".55"/>
  <!-- eye -->
  <circle cx="610" cy="514" r="62" fill="#fff3b0"/>
  <circle cx="610" cy="514" r="62" fill="none" stroke="#0b3d2e" stroke-width="16"/>
  <ellipse cx="616" cy="514" rx="15" ry="40" fill="#06271d"/>
  <circle cx="626" cy="494" r="9" fill="#fff"/>
  <!-- nostril -->
  <circle cx="800" cy="520" r="13" fill="#0b3d2e" opacity=".8"/>
</svg>
