<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iguana · interactive mockup</title>
<link rel="icon" href="assets/icon.png">
<style>
:root{--g:#a8f06a;--bar:rgba(18,26,22,.55);--panel:rgba(24,30,27,.82);--line:rgba(255,255,255,.08);--tx:#eef4ef;--mut:#8fa196;--row:rgba(255,255,255,.06)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:var(--tx);overflow:hidden;
 background:radial-gradient(1200px 700px at 78% 108%,#2fae7a 0,transparent 60%),radial-gradient(900px 600px at 10% 0,#1c4f7a 0,transparent 60%),linear-gradient(160deg,#0d2230,#0a1a17 60%,#13281f)}
.mbar{height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--bar);backdrop-filter:blur(30px) saturate(1.6);font-size:13px;font-weight:500}
.mbar .l,.mbar .r{display:flex;align-items:center;gap:16px}
.mbar .l b{font-weight:700}
.mbar svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;opacity:.9}
.ig{all:unset;cursor:pointer;display:grid;place-items:center;width:30px;height:22px;border-radius:6px;color:var(--tx)}
.ig.on,.ig:hover{background:rgba(255,255,255,.18)}
.ig img,.ig svg.gl{width:19px;height:17px;color:inherit}
.chev{opacity:.5}
/* panel */
.panel{position:absolute;top:34px;right:92px;width:340px;border-radius:14px;background:var(--panel);backdrop-filter:blur(40px) saturate(1.8);
 border:1px solid var(--line);box-shadow:0 24px 60px rgba(0,0,0,.45),0 0 0 .5px rgba(0,0,0,.6);padding:8px;transform-origin:88% 0;transition:.14s ease}
.panel.off{opacity:0;transform:scale(.96) translateY(-4px);pointer-events:none}
.search{display:flex;align-items:center;gap:8px;height:34px;padding:0 10px;border-radius:9px;background:var(--row);margin-bottom:6px}
.search svg{width:15px;height:15px;stroke:var(--mut);fill:none;stroke-width:1.8;stroke-linecap:round}
.search input{all:unset;flex:1;font-size:13.5px;color:var(--tx)}
.search input::placeholder{color:var(--mut)}
kbd{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
.sec{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);padding:9px 8px 4px;display:flex;justify-content:space-between}
.list{max-height:470px;overflow:auto;scrollbar-width:none}
.item{display:flex;align-items:center;gap:10px;height:38px;padding:0 8px;border-radius:8px;cursor:default}
.item.sel{background:rgba(168,240,106,.16)}
.item .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;flex:none;background:var(--row)}
.item .ic svg{width:14px;height:14px;fill:none;stroke:var(--tx);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.item .nm{flex:1;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{color:var(--mut);font-size:12px}
.item mark{background:none;color:var(--g);font-weight:700}
.item .pin{width:6px;height:6px;border-radius:50%;background:var(--g);opacity:0}
.item.p .pin{opacity:1}
.foot{display:flex;justify-content:space-between;align-items:center;padding:8px 8px 2px;margin-top:4px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px}
.foot span{display:flex;gap:10px}
.empty{padding:26px 0;text-align:center;color:var(--mut)}
.hint{position:absolute;left:24px;bottom:20px;color:rgba(255,255,255,.55);font-size:12px}
</style></head>
<body>
<div class="mbar">
 <div class="l"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span></div>
 <div class="r">
  <button class="ig on" id="tog" aria-label="Iguana"><svg class="gl" viewBox="150 220 760 680"><use href="#glyph"/></svg></button>
  <svg viewBox="0 0 16 16"><path d="M1.5 6a9 9 0 0 1 13 0M3.5 8.4a6 6 0 0 1 9 0M5.7 10.7a3 3 0 0 1 4.6 0"/><circle cx="8" cy="12.6" r=".6"/></svg>
  <svg viewBox="0 0 16 16"><rect x="1.5" y="4.5" width="11" height="7" rx="2"/><path d="M14 7v2"/></svg>
  <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.2 1.6"/></svg>
  <span>Fri 23 Oct&nbsp;&nbsp;18:12</span>
 </div>
</div>

<div class="panel" id="panel">
 <label class="search">
  <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="m10.5 10.5 3.5 3.5"/></svg>
  <input id="q" placeholder="Search menu bar" autocomplete="off" spellcheck="false">
  <kbd>⌃⌥␣</kbd>
 </label>
 <div class="list" id="list"></div>
 <div class="foot"><span><span><kbd>↑↓</kbd> move</span><span><kbd>↩</kbd> open</span><span><kbd>P</kbd> pin</span></span><span id="cnt"></span></div>
</div>
<div class="hint">Interactive mockup — type to filter, ↑↓ to move, Return to open, P to pin, Esc to close.</div>

<svg width="0" height="0" style="position:absolute"><defs><g id="glyph" fill="currentColor">
 <path d="M300 468 L262 338 L372 424 Z"/><path d="M388 420 L368 280 L470 392 Z"/><path d="M480 392 L478 256 L568 380 Z"/><path d="M572 382 L596 262 L660 394 Z"/>
 <path fill-rule="evenodd" d="M236 716 C150 580 296 430 456 410 C590 394 706 410 790 462 C856 502 864 580 794 616 C724 652 650 668 574 710 C470 768 330 810 236 716 ZM610 452 a62 62 0 1 0 .1 0 Z"/>
 <path d="M446 742 C470 840 560 872 590 800 C610 756 560 716 510 720 Z"/></g></defs></svg>

<script>
const I={wifi:'<path d="M2 8a9 9 0 0 1 12 0M4.5 10.5a5.5 5.5 0 0 1 7 0"/><circle cx="8" cy="13" r=".5"/>',
bat:'<rect x="1.5" y="4.5" width="11" height="7" rx="2"/><path d="M14 7v2"/>',
bt:'<path d="m4 5 8 6-4 3V2l4 3-8 6"/>',snd:'<path d="M2 6h2.5L8 3v10L4.5 10H2z"/><path d="M11 5.5a3.5 3.5 0 0 1 0 5"/>',
clk:'<circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.2 1.6"/>',moon:'<path d="M13 9.5A5.5 5.5 0 0 1 6.5 3a5.5 5.5 0 1 0 6.5 6.5z"/>',
disp:'<rect x="1.5" y="3" width="13" height="8" rx="1.5"/><path d="M5.5 14h5"/>',key:'<rect x="1.5" y="4" width="13" height="8" rx="2"/><path d="M4.5 8h7"/>',
vpn:'<path d="M8 1.5 13 3.5v4c0 3-2.3 5.3-5 6.5-2.7-1.2-5-3.5-5-6.5v-4z"/>',cal:'<rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 7h12M5 1.5v3M11 1.5v3"/>',
clip:'<rect x="3" y="3" width="10" height="11" rx="2"/><path d="M6 3V2h4v1"/>',tim:'<circle cx="8" cy="9" r="5"/><path d="M8 6v3l1.5 1M6.5 1.5h3"/>',
note:'<path d="M4 2h6l3 3v9H4z"/><path d="M6 8h5M6 11h3"/>',sun:'<circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.5M8 13v1.5M1.5 8H3M13 8h1.5M3.4 3.4l1 1M11.6 11.6l1 1M3.4 12.6l1-1M11.6 4.4l1-1"/>',
shot:'<path d="M2 5V3.5A1.5 1.5 0 0 1 3.5 2H5M11 2h1.5A1.5 1.5 0 0 1 14 3.5V5M14 11v1.5a1.5 1.5 0 0 1-1.5 1.5H11M5 14H3.5A1.5 1.5 0 0 1 2 12.5V11"/><circle cx="8" cy="8" r="2"/>',
mic:'<rect x="6" y="1.5" width="4" height="8" rx="2"/><path d="M3.5 7.5a4.5 4.5 0 0 0 9 0M8 12v2.5"/>',
cast:'<path d="M2 5V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H9M2 8.5a4.5 4.5 0 0 1 4.5 4.5M2 11.5A1.5 1.5 0 0 1 3.5 13"/>',
cpu:'<rect x="4" y="4" width="8" height="8" rx="1.5"/><path d="M6.5 1.5v2M9.5 1.5v2M6.5 12.5v2M9.5 12.5v2M1.5 6.5h2M1.5 9.5h2M12.5 6.5h2M12.5 9.5h2"/>'};
const D=[
 {n:'Wi-Fi',i:'wifi',s:'Home 5G',g:'Pinned',p:1},{n:'Battery',i:'bat',s:'87%',g:'Pinned',p:1},{n:'Clock',i:'clk',s:'18:12',g:'Pinned',p:1},
 {n:'Bluetooth',i:'bt',s:'2 devices',g:'Stack'},{n:'Sound',i:'snd',s:'Speakers',g:'Stack'},{n:'Focus',i:'moon',s:'Off',g:'Stack'},
 {n:'Display',i:'disp',s:'Built-in',g:'Stack'},{n:'Keyboard',i:'key',s:'EN',g:'Stack'},{n:'VPN',i:'vpn',s:'Connected',g:'Stack'},
 {n:'Calendar',i:'cal',s:'Next 19:30',g:'Stack'},{n:'Clipboard',i:'clip',s:'24 clips',g:'Stack'},{n:'Timer',i:'tim',s:'—',g:'Stack'},
 {n:'Notes',i:'note',s:'',g:'Stack'},{n:'Weather',i:'sun',s:'21°',g:'Stack'},{n:'Screenshot',i:'shot',s:'',g:'Stack'},
 {n:'Microphone',i:'mic',s:'In use',g:'Hidden'},{n:'Screen Mirroring',i:'cast',s:'',g:'Hidden'},{n:'System Monitor',i:'cpu',s:'4%',g:'Hidden'}];
const $=s=>document.querySelector(s);let sel=0,view=[];
function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function match(n,q){if(!q)return null;const i=n.toLowerCase().indexOf(q);if(i>=0)return[i,i+q.length];
 let j=0,r=[];for(let k=0;k<n.length&&j<q.length;k++)if(n[k].toLowerCase()==q[j]){r.push(k);j++}return j==q.length?r:false}
function hl(n,m,q){if(!m)return esc(n);if(typeof m[0]=='number'&&m.length==2&&n.toLowerCase().includes(q))return esc(n.slice(0,m[0]))+'<mark>'+esc(n.slice(m[0],m[1]))+'</mark>'+esc(n.slice(m[1]));
 return[...n].map((c,k)=>m.includes(k)?'<mark>'+esc(c)+'</mark>':esc(c)).join('')}
function render(){const q=$('#q').value.trim().toLowerCase();view=[];let h='';
 const order=['Pinned','Stack','Hidden'];
 for(const g of order){const it=D.filter(d=>(d.p?'Pinned':d.g=='Pinned'?'Stack':d.g)==g).map(d=>({d,m:match(d.n,q)})).filter(x=>x.m!==false);
  if(!it.length)continue;
  h+=`<div class="sec"><span>${q?g+' · match':g}</span><span>${it.length}</span></div>`;
  for(const x of it){const k=view.length;view.push(x.d);
   h+=`<div class="item ${x.d.p?'p':''} ${k==sel?'sel':''}" data-k="${k}"><div class="ic"><svg viewBox="0 0 16 16">${I[x.d.i]}</svg></div><div class="nm">${hl(x.d.n,x.m,q)}</div><div class="st">${esc(x.d.s)}</div><div class="pin"></div></div>`}}
 if(!view.length)h='<div class="empty">Nothing matches “'+esc(q)+'”</div>';
 sel=Math.min(sel,Math.max(view.length-1,0));$('#list').innerHTML=h;
 $('#cnt').textContent=view.length+' of '+D.length;
 const s=$('.item.sel');s&&s.scrollIntoView({block:'nearest'})}
function setSel(k){sel=(k+view.length)%view.length;render()}
$('#q').addEventListener('input',()=>{sel=0;render()});
document.addEventListener('keydown',e=>{
 if(e.key=='ArrowDown'){e.preventDefault();setSel(sel+1)}
 else if(e.key=='ArrowUp'){e.preventDefault();setSel(sel-1)}
 else if(e.key=='Escape'){$('#panel').classList.add('off');$('#tog').classList.remove('on')}
 else if(e.key=='Enter'&&view[sel]){const el=$('.item.sel');el.animate([{background:'rgba(168,240,106,.5)'},{background:'rgba(168,240,106,.16)'}],200)}
 else if((e.key=='p'||e.key=='P')&&document.activeElement.id!='q'&&view[sel]){view[sel].p=view[sel].p?0:1;render()}
 else if(e.altKey&&e.key.toLowerCase()=='p'&&view[sel]){view[sel].p=view[sel].p?0:1;render()}});
$('#list').addEventListener('mousemove',e=>{const t=e.target.closest('.item');if(t&&+t.dataset.k!=sel){sel=+t.dataset.k;document.querySelectorAll('.item').forEach(x=>x.classList.toggle('sel',x==t))}});
$('#tog').onclick=()=>{const o=$('#panel').classList.toggle('off');$('#tog').classList.toggle('on',!o);if(!o)$('#q').focus()};
$("#q").value=new URLSearchParams(location.search).get("q")||"";render();$("#q").focus();
</script>
</body></html>
